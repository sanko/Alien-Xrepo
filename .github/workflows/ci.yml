---
concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}'
jobs:
  freebsd:
    name: FreeBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel","platform_name":"freebsd","os":"freebsd","arch":"x86_64","toolchain":"gcc","prepare":"pkg install -y perl5 gmake curl"},
          {"name":"ARM","platform_name":"freebsd","os":"freebsd","arch":"aarch64","toolchain":"gcc","prepare":"pkg install -y perl5 gmake curl"}
        ]
      os_version: 14.1
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .

  linux:
    name: Linux
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel [Ubuntu 26.04]","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-26.04","toolchain":"gcc"},
          {"name":"Intel [Ubuntu 24.04]","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"name":"Intel [Ubuntu 22.04]","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-22.04","toolchain":"gcc"},
          {"name":"ARM [Ubuntu 26.04]","arch":"aarch64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-26.04-arm","toolchain":"clang"},
          {"name":"ARM [Ubuntu 24.04]","arch":"aarch64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04-arm","toolchain":"clang"},
          {"name":"ARM [Ubuntu 22.04]","arch":"aarch64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-22.04-arm","toolchain":"clang"},
          {"name":"RISC-V [Ubuntu 24.04]","arch":"riscv64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04-riscv","toolchain":"gcc"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via its canonical one-liner; on a writable perl (a
        #~ source build) it lands in the perl's own bin dir, which the runner
        #~ puts on PATH. Distro perl is read-only to the runner user, so
        #~ cpanm relocates every install into $HOME/perl5 instead. Adopt that
        #~ layout (PATH + local::lib env) so cpanm deps and the Build steps
        #~ share one module pool. No-op when $HOME/perl5 was never created.
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        if [ -x "$HOME/perl5/bin/cpanm" ]; then
          export PATH="$HOME/perl5/bin:$PATH"
          "$HOME/perl5/bin/cpanm" --local-lib="$HOME/perl5" --notest local::lib
          eval "$(perl -I "$HOME/perl5/lib/perl5" -Mlocal::lib)"
        fi
        command -v cpanm
        #~ A source-built perl is writable, so this first attempt installs straight
        #~ into it and nothing changes for those legs. The distro perl of the
        #~ ubuntu-26.04 default legs is not writable, and Affix::Build writes to
        #~ its site paths no matter what local::lib says, so when the plain
        #~ install fails, retry as root through the absolute cpanm path (sudo
        #~ resets PATH, so a bare name would not be found).
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v . \
          || sudo "$(command -v cpanm)" --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v
  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Apple Silicon","arch":"aarch64","perl_version":"5.42.0","variant":"default","platform_name":"macos","os":"macos-15","toolchain":"clang"},
          {"name":"Intel","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"macos","os":"macos-15-intel","toolchain":"clang"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via its canonical one-liner; it installs into the
        #~ active (source-built) perl's bin dir, which the runner puts on PATH.
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v

  results:
    if: always()
    name: Results
    needs:
      - linux
      - macos
      - windows
      - freebsd
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
    with:
      title: Brocken CI Matrix
  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel","arch":"x86_64","platform_name":"windows","os":"windows-2022",  "variant":"5.42.3.1","prepare":"curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"},
          {"name":"ARM","arch":"aarch64","platform_name":"windows", "os":"windows-11-arm","variant":"5.42.3.1","prepare":"curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -e 'print qq(perl=\$^X :: \$^O\n)'
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        cpanm --test-only -v .
name: CI Matrix
on:
  pull_request: ~
  push: ~
  schedule:
    - cron: 42 5 * * 0
  workflow_dispatch: ~
permissions:
  actions: read
  contents: read
