---
jobs:
  linux:
    name: Examples (Linux)
    secrets: inherit
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      matrix: |
        [
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5","prepare":"sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev"}
        ]
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir).
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        #~ Install the engine the example dists build against; Alien::Xmake
        #~ also fetches the xmake/xrepo binaries the pipeline needs.
        cpanm -v .
        #~ Hand each example dist under eg/examples/ off to cpanm (they inherit
        #~ the engine just installed). Fail the job if any dist fails.
        #~ Exotic-Raylib6 needs the system OpenGL headers (xrepo's optional
        #~ `opengl` dep); those arrive via the runner's `prepare` step above.
        skip_re='Exotic-SQLite3'
        failed=0
        for dist in eg/examples/*/; do
          if printf '%s' "$dist" | grep -Eq "$skip_re"; then
            echo "::warning::skipping $dist (unbuildable in this environment)"
            continue
          fi
          if [ -e "$dist/Build.PL" ] || [ -e "$dist/Makefile.PL" ]; then
            echo "::group::Building $dist"
            pushd "$dist"
            if cpanm -v .; then
              echo "::notice::$dist installed OK"
            else
              echo "::error::$dist FAILED to build/install"
              failed=$((failed + 1))
            fi
            popd
            echo "::endgroup::Building $dist"
          else
            echo "::warning::skipping $dist (no Build.PL/Makefile.PL)"
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "::error::$failed example dist(s) failed to build/install"
          exit 1
        fi
        echo "All example dists built and installed"
  macos:
    name: Examples (macOS)
    secrets: inherit
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      matrix: |
        [
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.3","prepare":"brew install openssl@3 go"}
        ]
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        #~ Install the engine the example dists build against.
        cpanm -v .
        #~ Hand each example dist under eg/examples/ off to cpanm. Fail the job
        #~ if any dist fails.
        #~ Exotic-Lsquic needs BoringSSL headers; the xrepo `boringssl` recipe
        #~ pulls in Go, and the system OpenSSL is the fallback (both come from
        #~ the runner's `prepare` step above).
        skip_re='Exotic-SQLite3'
        failed=0
        for dist in eg/examples/*/; do
          if printf '%s' "$dist" | grep -Eq "$skip_re"; then
            echo "::warning::skipping $dist (unbuildable in this environment)"
            continue
          fi
          if [ -e "$dist/Build.PL" ] || [ -e "$dist/Makefile.PL" ]; then
            echo "::group::Building $dist"
            pushd "$dist"
            if cpanm -v .; then
              echo "::notice::$dist installed OK"
            else
              echo "::error::$dist FAILED to build/install"
              failed=$((failed + 1))
            fi
            popd
            echo "::endgroup::Building $dist"
          else
            echo "::warning::skipping $dist (no Build.PL/Makefile.PL)"
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "::error::$failed example dist(s) failed to build/install"
          exit 1
        fi
        echo "All example dists built and installed"
  windows:
    name: Examples (Windows)
    secrets: inherit
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      matrix: |
        [
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"msvc","prepare":"choco install strawberryperl"}
        ]
      task: |
        #~ The reusable workflow puts the MSVC toolchain and Strawberry's perl
        #~ on PATH for an msvc leg, so no PATH surgery here.
        perl -V
        #~ Install cpanm via its canonical self-bootstrap.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        #~ Install the engine the example dists build against.
        cpanm -v .
        #~ Hand each example dist under eg/examples/ off to cpanm. Fail the job
        #~ if any dist fails.
        #~ The msvc toolchain puts xmake on the `windows` platform, which is
        #~ what the vcpkg and lsquic recipes require, so those two now build
        #~ here. Exotic-Zlib still can't: xmake resolves zlib from the runner's
        #~ pre-installed vcpkg outside the isolated store, which Alien::Xrepo
        #~ rejects by design.
        skip_re='Exotic-SQLite3|Exotic-Zlib'
        failed=0
        for dist in eg/examples/*/; do
          if printf '%s' "$dist" | grep -Eq "$skip_re"; then
            echo "::warning::skipping $dist (unbuildable in this environment)"
            continue
          fi
          if [ -e "$dist/Build.PL" ] || [ -e "$dist/Makefile.PL" ]; then
            echo "::group::Building $dist"
            pushd "$dist"
            if cpanm -v .; then
              echo "::notice::$dist installed OK"
            else
              echo "::error::$dist FAILED to build/install"
              failed=$((failed + 1))
            fi
            popd
            echo "::endgroup::Building $dist"
          else
            echo "::warning::skipping $dist (no Build.PL/Makefile.PL)"
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "::error::$failed example dist(s) failed to build/install"
          exit 1
        fi
        echo "All example dists built and installed"
name: Examples
on:
  pull_request: ~
  push:
    branches:
      - main
      - dev
      - dev-repair
  workflow_dispatch: ~
permissions:
  actions: read
  contents: read
